<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tim Beardsley — AI, Tech & Productivity</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .container { max-width: 640px; width: 100%; }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 16px;
    padding: 3rem;
    text-align: center;
  }
  .avatar {
    width: 96px;
    height: 96px;
    background: linear-gradient(135deg, #58a6ff, #a371f7);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    font-weight: 700;
    color: #fff;
    margin: 0 auto 1.5rem;
  }
  h1 { font-size: 1.75rem; color: #f0f6fc; margin-bottom: 0.5rem; }
  .tagline { color: #8b949e; font-size: 1.1rem; margin-bottom: 2rem; }
  .links { display: flex; flex-direction: column; gap: 0.75rem; }
  .link {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.75rem 1.25rem;
    background: #21262d;
    border: 1px solid #30363d;
    border-radius: 8px;
    color: #c9d1d9;
    text-decoration: none;
    font-size: 0.95rem;
    transition: background 0.2s, border-color 0.2s;
  }
  .link:hover { background: #30363d; border-color: #58a6ff; }
  .link-icon { font-size: 1.2rem; width: 24px; text-align: center; }
  .topics {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
    justify-content: center;
    margin-top: 1.5rem;
  }
  .topic {
    background: #1f6feb22;
    color: #58a6ff;
    border: 1px solid #1f6feb44;
    padding: 0.25rem 0.75rem;
    border-radius: 20px;
    font-size: 0.8rem;
  }
  .footer { margin-top: 2rem; color: #484f58; font-size: 0.8rem; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <div class="avatar">TB</div>
    <h1>Tim Beardsley</h1>
    <p class="tagline">AI tools, tech automation & productivity systems</p>

    <div class="topics">
      <span class="topic">AI & LLMs</span>
      <span class="topic">Python</span>
      <span class="topic">Linux</span>
      <span class="topic">Networking</span>
      <span class="topic">Cybersecurity</span>
      <span class="topic">Automation</span>
      <span class="topic">Terminal Tools</span>
    </div>

    <div class="links" style="margin-top:2rem;">
      <a class="link" href="https://github.com/tmbeards" target="_blank">
        <span class="link-icon">⌨️</span>
        github.com/tmbeards
      </a>
      <a class="link" href="https://x.com/tmbeards" target="_blank">
        <span class="link-icon">𝕏</span>
        @tmbeards (X / Twitter)
      </a>
      <a class="link" href="https://tmbeards.app.n8n.cloud" target="_blank">
        <span class="link-icon">🔗</span>
        Automation Hub (n8n)
      </a>
    </div>

    <p class="footer">
      Building and breaking things in the terminal since 2024
    </p>
  </div>
</div>
</body>
</html>
